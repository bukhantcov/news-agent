<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#0A0A0F; }
  .canvas {
    width:1080px; height:1350px; position:relative;
    background:#0A0A0F;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 130px;
  }
  .ring {
    position:absolute; width:420px; height:420px; border-radius:50%;
    border:1px solid rgba(212,168,83,0.22); top:-160px; right:-160px;
  }
  .label {
    font-family:'Manrope',sans-serif; font-weight:700; font-size:22px; letter-spacing:5px;
    color:#D4A853; text-transform:uppercase; margin-bottom:44px; z-index:2;
  }
  .rule { width:64px; height:3px; background:#D4A853; margin-bottom:44px; z-index:2; }
  .quote {
    font-family:'Cormorant Garamond',serif; font-weight:500; font-style:italic; font-size:58px; line-height:1.32;
    color:#F7F4EE; z-index:2;
  }
  .source {
    margin-top:56px; font-family:'Manrope',sans-serif; font-weight:500; font-size:22px;
    color:#F0ECE4; opacity:0.6; z-index:2;
  }
  .foot {
    position:absolute; bottom:86px; left:130px; display:flex; align-items:center; gap:14px;
  }
  .foot .brand { font-family:'Manrope',sans-serif; font-weight:700; font-size:19px; letter-spacing:4px; color:#D4A853; }
  .foot .handle { font-family:'Manrope',sans-serif; font-weight:500; font-size:17px; color:#F0ECE4; opacity:0.5; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="ring"></div>
    <div class="label">Механика</div>
    <div class="rule"></div>
    <div class="quote">{{TEXT}}</div>
    <div class="source">{{SOURCE}}</div>
    <div class="foot">
      <div class="brand">УКЛАД</div>
      <div class="handle">@ukladapp</div>
    </div>
  </div>
</body>
</html>
