<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#0A0A0F; }
  .canvas {
    width:1080px; height:1350px; position:relative;
    background:radial-gradient(ellipse at 50% 38%, #14141F 0%, #0A0A0F 62%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ring {
    position:absolute; width:560px; height:560px; border-radius:50%;
    border:1px solid rgba(212,168,83,0.35); top:395px; left:260px;
  }
  .ring::before, .ring::after {
    content:""; position:absolute; width:6px; height:6px; border-radius:50%; background:#D4A853;
  }
  .ring::before { top:60px; right:24px; }
  .ring::after { bottom:70px; left:34px; opacity:0.6; }
  .label {
    font-family:'Manrope',sans-serif; font-weight:700; font-size:22px; letter-spacing:6px;
    color:#D4A853; text-transform:uppercase; margin-bottom:56px; z-index:2;
  }
  .quote {
    font-family:'Cormorant Garamond',serif; font-weight:600; font-size:76px; line-height:1.28;
    color:#F7F4EE; text-align:center; width:820px; z-index:2;
  }
  .foot {
    position:absolute; bottom:86px; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .foot .brand { font-family:'Manrope',sans-serif; font-weight:700; font-size:20px; letter-spacing:5px; color:#D4A853; }
  .foot .handle { font-family:'Manrope',sans-serif; font-weight:500; font-size:17px; color:#F0ECE4; opacity:0.55; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="ring"></div>
    <div class="label">Установка</div>
    <div class="quote">{{TEXT}}</div>
    <div class="foot">
      <div class="brand">УКЛАД</div>
      <div class="handle">@ukladapp</div>
    </div>
  </div>
</body>
</html>
