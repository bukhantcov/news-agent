name: Uklad Channel Poster

on:
  # schedule: убран — у GH Actions schedule для этого репо опоздание
  # 5+ часов (проверено 16-17.09.2026, включая cloud-раннер Telegram,
  # то есть дело не в self-hosted). Время держит launchd-триггер на
  # маке владельца: ~/actions-runner-uklad/uklad-daily-trigger.sh.
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only verify bot token and channel rights, do not publish'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: uklad-poster

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Check bot access
        if: inputs.check_only
        run: python uklad/poster.py --check
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          UKLAD_CHANNEL_ID: ${{ vars.UKLAD_CHANNEL_ID }}
      - name: Publish next post
        if: ${{ !inputs.check_only }}
        run: python uklad/poster.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          UKLAD_CHANNEL_ID: ${{ vars.UKLAD_CHANNEL_ID }}
      - name: Commit published state
        if: ${{ !inputs.check_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add uklad/published.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(uklad): mark post published"
            git pull --rebase --quiet
            git push
          fi
