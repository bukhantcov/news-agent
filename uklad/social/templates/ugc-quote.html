<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#0A0A0F; }
  .canvas {
    width:1080px; height:1350px; position:relative;
    background:#0A0A0F;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:0 120px;
  }
  .mark {
    position:absolute; top:220px; left:120px; font-family:'Cormorant Garamond',serif; font-weight:600;
    font-size:220px; color:#14141F; line-height:1; z-index:0;
  }
  .label {
    font-family:'Manrope',sans-serif; font-weight:700; font-size:20px; letter-spacing:5px;
    color:#D4A853; text-transform:uppercase; margin-bottom:48px; z-index:2;
  }
  .quote {
    font-family:'Cormorant Garamond',serif; font-weight:500; font-size:60px; line-height:1.35;
    color:#F7F4EE; text-align:center; z-index:2;
  }
  .attribution {
    margin-top:48px; font-family:'Manrope',sans-serif; font-weight:700; font-size:24px;
    color:#D4A853; z-index:2;
  }
  .foot {
    position:absolute; bottom:86px; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .foot .brand { font-family:'Manrope',sans-serif; font-weight:700; font-size:20px; letter-spacing:5px; color:#D4A853; }
  .foot .handle { font-family:'Manrope',sans-serif; font-weight:500; font-size:17px; color:#F0ECE4; opacity:0.55; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="mark">”</div>
    <div class="label">Из сообщества</div>
    <div class="quote">{{TEXT}}</div>
    <div class="attribution">— {{ATTRIBUTION}}</div>
    <div class="foot">
      <div class="brand">УКЛАД</div>
      <div class="handle">@ukladapp</div>
    </div>
  </div>
</body>
</html>
