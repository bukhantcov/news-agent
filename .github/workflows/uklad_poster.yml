name: Uklad Channel Poster

on:
  schedule:
    # Mon, Wed, Fri at 10:00 MSK
    - cron: '0 7 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uklad-poster

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Publish next post
        run: python uklad/poster.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          UKLAD_CHANNEL_ID: ${{ vars.UKLAD_CHANNEL_ID }}
      - name: Commit published state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add uklad/published.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(uklad): mark post published"
            git push
          fi
