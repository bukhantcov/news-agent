name: Uklad Threads Poster

# Живой прогон подтверждён 16.09.2026 (тезис 1/15 ушёл в @ukladapp).
# Крон включён по расписанию Telegram-постера (uklad_poster.yml).
on:
  schedule:
    # Mon, Wed, Fri at 10:00 MSK
    - cron: '0 7 * * 1,3,5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ввести текст, но не жать "Опубликовать"'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: uklad-threads-poster

jobs:
  post:
    # self-hosted: GitHub-хостед раннер бьёт с дата-центрового IP,
    # Threads такие запросы режет 4xx на уровне WAF. Раннер на маке
    # владельца — тот же IP, с которого сохранялась сессия.
    runs-on: [self-hosted, uklad-social]
    steps:
      - uses: actions/checkout@v4
      - run: pip3 install --quiet playwright
      - run: python3 -m playwright install webkit
      - name: Publish next thread
        env:
          THREADS_SESSION_STATE: ${{ secrets.THREADS_SESSION_STATE }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 -m uklad.social.poster_threads --dry-run
          else
            python3 -m uklad.social.poster_threads
          fi
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: threads-poster-failure
          path: uklad/social/session/recon/threads_poster_failure.png
          retention-days: 3
      - name: Commit published state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add uklad/social/threads_published.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(uklad): mark threads post published"
            git push
          fi
